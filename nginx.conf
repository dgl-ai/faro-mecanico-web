server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types explicitos para el export Godot Web
    include /etc/nginx/mime.types;
    types {
        application/wasm                 wasm;
        application/octet-stream         pck;
        audio/ogg                        ogg oga;
        application/javascript           js;
        text/html                        html;
        text/plain                       txt;
    }

    # Cache: HTML sin cache (builds cambiantes); assets inmutables por nombre 1h
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /BUILD_INFO.txt {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /index.html;
    }
}
