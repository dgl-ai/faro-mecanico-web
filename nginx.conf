server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types explicitos para el export Godot Web
    include /etc/nginx/mime.types;
    types {
        application/wasm                 wasm;
        application/octet-stream         pck;
        audio/ogg                        ogg oga;
        application/javascript           js;
        text/html                        html;
        text/plain                       txt;
    }

    # Cache: HTML y ficheros de build con nombres fijos (index.js/.wasm/.pck) sin cache,
    # para que cada nueva build se sirva fresca y los 404 no queden cacheados.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /BUILD_INFO.txt {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(js|wasm|pck)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /index.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # Sin fallback a index.html: un fichero de build inexistente debe dar 404
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
